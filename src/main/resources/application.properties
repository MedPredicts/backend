spring.application.name=medpredict-backend
server.port=${PORT:8080}
medpredict.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
