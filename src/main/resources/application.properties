spring.application.name=medpredict-backend
application.default-locale=${DEFAULT_LOCALE:ru}
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
server.port=${PORT:8080}
medpredict.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
medpredict.model.directory=${MEDPREDICT_MODEL_DIRECTORY:./model}
medpredict.model.expected-version=${MEDPREDICT_MODEL_VERSION:}
